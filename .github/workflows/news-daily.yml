name: Daily verified learning news

on:
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

concurrency:
  group: daily-learning-news
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - name: Check official sources
        run: npm run news:watch
      - name: Publish at most one verified update
        id: publish
        continue-on-error: true
        env:
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
          NEWS_LLM_API_URL: ${{ vars.NEWS_LLM_API_URL }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
        run: npm run news:publish
      - name: Verify content, metadata, and static export
        run: npm run news:test && npm run lint && npm run build && npm run site:links
      - name: Commit generated article and assets
        run: |
          if git diff --quiet; then
            echo "No qualifying official update today."
            exit 0
          fi
          git config user.name "manapick-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/news.json public/og/news public/news-feed.xml public/llms.txt
          git commit -m "content: publish verified daily learning news"
          git push
      - name: Report an unavailable article generator once
        if: steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Daily learning news generator needs attention"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open; no duplicate issue created."
          else
            gh issue create \
              --title "$title" \
              --body "Official-source monitoring succeeded, but the configured NEWS_LLM provider was unavailable or incomplete. No unverified article was published. Required settings: secret NEWS_LLM_API_KEY, variables NEWS_LLM_API_URL and NEWS_LLM_MODEL. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Open an issue when a verification gate fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Daily learning news quality gate failed"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open; no duplicate issue created."
          else
            gh issue create \
              --title "$title" \
              --body "The scheduled verification gate failed. No unverified article was published. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
